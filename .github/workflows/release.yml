name: release

on:
  push:
    branches:
      - "feature/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - run: test -z "$(git status --porcelain)"
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            command: ./cmd/chimera-server
            asset: chimera-server-linux-amd64
          - goos: linux
            command: ./cmd/chimera-client
            asset: chimera-client-linux-amd64
          - goos: windows
            command: ./cmd/chimera-server
            asset: chimera-server-windows-amd64.exe
          - goos: windows
            command: ./cmd/chimera-client
            asset: chimera-client-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Build clean asset
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/chimera-release"
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/chimera-release/${{ matrix.asset }}" "${{ matrix.command }}"
          go version -m "$RUNNER_TEMP/chimera-release/${{ matrix.asset }}" | tee "$RUNNER_TEMP/build-meta.txt"
          grep -F "vcs.revision=$GITHUB_SHA" "$RUNNER_TEMP/build-meta.txt"
          grep -F "vcs.modified=false" "$RUNNER_TEMP/build-meta.txt"
          test -z "$(git status --porcelain)"
      - name: Binary vulnerability scan with exact package-graph allowlist
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          REPORT="$RUNNER_TEMP/chimera-release/${{ matrix.asset }}-govulncheck.txt"
          ASSESSMENT="$RUNNER_TEMP/chimera-release/${{ matrix.asset }}-govulncheck-assessment.txt"
          set +e
          govulncheck -mode=binary "$RUNNER_TEMP/chimera-release/${{ matrix.asset }}" 2>&1 | tee "$REPORT"
          SCAN_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$SCAN_STATUS" -eq 0 ]; then
            printf 'binary scan: no findings\n' > "$ASSESSMENT"
          else
            IDS=$(grep -oE 'GO-[0-9]{4}-[0-9]+' "$REPORT" | sort -u || true)
            test -n "$IDS" || exit "$SCAN_STATUS"
            UNEXPECTED=$(printf '%s\n' "$IDS" | grep -v '^GO-2026-5932$' || true)
            test -z "$UNEXPECTED" || { echo "unexpected advisories: $UNEXPECTED" >&2; exit 1; }
            if go list -deps "${{ matrix.command }}" | grep -q '^golang.org/x/crypto/openpgp'; then
              echo 'GO-2026-5932 is reachable in the package graph' >&2
              exit 1
            fi
            printf 'GO-2026-5932 is a binary-mode module finding; golang.org/x/crypto/openpgp is absent from go list -deps for %s.\n' "${{ matrix.command }}" > "$ASSESSMENT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/chimera-release/${{ matrix.asset }}*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum chimera-* > checksums-sha256.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          Chimera v0.5 replaces the v0.3/v0.4 raw QUIC carrier with standards-valid HTTP/3 CONNECT.

          Breaking change: upgrade the server and client together before using QUIC or auto mode. TCP/REALITY remains wire-compatible.

          QUIC requires the independent PSK and pinned certificate fingerprint printed by the v0.5 installer. It carries TCP CONNECT streams over UDP/HTTP3 and does not implement UDP ASSOCIATE.

          Release assets include the raw binary govulncheck output and a package-graph assessment. No advisory other than the exact GO-2026-5932 module-only OpenPGP finding is allowed, and that finding is accepted only when OpenPGP is absent from `go list -deps`.
          EOF
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Chimera $GITHUB_REF_NAME" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
